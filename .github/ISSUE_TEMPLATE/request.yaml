name: Request
description: Request Minecraft classes or symbols for LeviLamina
title: "Request symbols for <your-mod-name>"
body:
  - type: input
    id: mod
    attributes:
      label: Mod
      description: >-
        Your mod's public GitHub repository, as `https://github.com/<owner>/<repo>`.
        Use its current URL, not an old one that redirects. It must have a `README.md` that mentions the mod name in the issue title.
      placeholder: https://github.com/LiteLDev/LeviLamina
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: The platform your mod targets.
      options:
        - Server for Windows
        - Client for Windows
        - Client for Android
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Justification
      description: What your mod does and why it needs these. At most 200 tokens.
      placeholder: I'm making a mod that gives players a starter pack on their first join, so I need...
    validations:
      required: true

  - type: textarea
    id: classes
    attributes:
      label: Classes
      description: Classes whose member variables you need. One per line; at most 64 classes and symbols in total.
      placeholder: |
        Player
        Actor::BuiltInComponents

  - type: textarea
    id: symbols
    attributes:
      label: Symbols
      description: Unresolved symbols from the linker error. One per line; at most 64 classes and symbols in total.
      placeholder: |
        ?getPosition@Actor@@QEBAAEBVVec3@@XZ
        ?tick@Player@@UEAAXXZ
